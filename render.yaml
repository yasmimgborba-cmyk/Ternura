# Deploy em 1 clique: https://render.com/deploy?repo=https://github.com/yasmimgborba-cmyk/Ternura
services:
  - type: web
    name: ternura
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: pedidos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/db.json
      - key: BRAND_NAME
        value: Ternura
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_METHODS
        value: card
