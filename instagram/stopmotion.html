<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root { --menta:#AFD4C0; --menta-e:#5E9C83; --choco:#88553E; --choco-e:#4E2A1A; --creme:#FAF6E6; --rosa:#F594A7; --rosa-e:#E2687F; --rosa-c:#FBE3EA; }
* { box-sizing:border-box; margin:0; }
body { width:1080px; height:1920px; overflow:hidden; font-family:Nunito, sans-serif; color:var(--choco-e); }
#palco { position:relative; width:1080px; height:1920px; overflow:hidden; background:#FFF6EE;
  background-image:linear-gradient(rgba(175,212,192,.5) 2px, transparent 2px), linear-gradient(90deg, rgba(175,212,192,.5) 2px, transparent 2px); background-size:60px 60px; }
#palco.rosa { background-color:var(--rosa-c); } #palco.menta { background-color:#DDF2E9; } #palco.choco { background-color:#5A3322; background-image:radial-gradient(rgba(250,246,230,.12) 10px, transparent 11px); background-size:70px 70px; }
.e { position:absolute; transform-origin:center; filter:drop-shadow(0 16px 18px rgba(78,42,26,.25)); }
.tit { font-family:Fredoka; font-weight:700; line-height:.92; color:var(--creme); -webkit-text-stroke:22px var(--choco-e); paint-order:stroke fill; text-shadow:0 12px 0 rgba(78,42,26,.45); text-align:center; }
.balao { background:#fff; border:7px solid var(--choco-e); border-radius:44px; padding:30px 40px; font-weight:900; font-size:56px; text-align:center; }
.pol { background:#fff; padding:18px 18px 86px; }
.pol img { display:block; width:100%; height:100%; object-fit:cover; object-position:top; }
.pol span { position:absolute; left:0; right:0; bottom:16px; text-align:center; font-family:Caveat; font-size:56px; }
.tag { font-family:Fredoka; font-weight:700; font-size:70px; padding:10px 40px; border-radius:999px; border:7px solid var(--choco-e); }
.selo { width:360px; height:360px; border-radius:50%; background:var(--rosa-e); color:#fff; border:10px solid var(--choco-e); display:grid; place-items:center; text-align:center; font-family:Fredoka; font-weight:700; font-size:120px; line-height:.9; }
.selo small { display:block; font-size:40px; }
.cel { background:#161616; border-radius:62px; padding:16px; }
.cel img { display:block; width:100%; border-radius:48px; }
.cor { color:var(--rosa-e); font-size:110px; }
.papel { position:absolute; inset:0; pointer-events:none; opacity:.08; background-image:radial-gradient(#000 1px, transparent 1.3px); background-size:4px 4px; }
</style></head>
<body><div id="palco"></div>
<script>
const P = (n) => `arte/recortes/${n}.png`;
const palco = document.getElementById('palco');
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const CORES = ['#FAF6E6', '#AFD4C0', '#F594A7', '#F4C95D', '#FFFFFF', '#E2687F'];
// elemento: [html, x, y, w, rot, inicio]  -> "pulinho" de massinha nos primeiros quadros
const E = (html, x, y, w, r = 0, ini = 0) => ({ html, x, y, w, r, ini });
const puff = (x, y, s = 1) => E(`<svg viewBox="0 0 200 160" style="width:100%"><g fill="#fff" stroke="#4E2A1A" stroke-width="7"><circle cx="60" cy="90" r="45"/><circle cx="110" cy="60" r="55"/><circle cx="150" cy="100" r="40"/><circle cx="95" cy="115" r="40"/></g></svg>`, x, y, 360 * s);
function granulado(n, x0, y0, w, h, sd) {
  let s2 = sd; const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
  let out = '';
  for (let i = 0; i < n; i++) { const x = x0 + r2() * w, y = y0 + r2() * h, a = r2() * 180, c = CORES[Math.floor(r2() * CORES.length)];
    out += `<i style="position:absolute;left:${x}px;top:${y}px;width:34px;height:11px;border-radius:6px;background:${c};transform:rotate(${a}deg)"></i>`; }
  return out;
}
const cenas = [
  { q: 30, fundo: '', els: (f) => {
      const txt = 'oii!'.slice(0, Math.max(0, Math.floor((f - 8) / 2)));
      return [
        E(`<img src="${P('apontando')}" style="width:100%">`, Math.max(380, 1080 - f * 80), 520, 700, -2),
        ...(f >= 8 ? [E(`<div class="balao" style="min-height:190px">${txt}${f >= 16 ? ' ♡' : ''}<br><span style="font-size:42px;color:#E2687F">${f >= 18 ? 'eu sou a Ternura' : '&nbsp;'}</span></div>`, 70, 320, 520, -5, 8)] : []),
        ...(f >= 18 ? [E(`<span style="font-size:110px">♡</span>`, 120, 900, 120, 10, 18)] : []),
        ...(f >= 21 ? [E(`<span style="font-size:80px;color:#E2687F">✦</span>`, 300, 1050, 90, -8, 21)] : []),
        ...(f >= 24 ? [E(`<span style="font-size:120px;color:#5E9C83">✦</span>`, 160, 1250, 140, 6, 24)] : []),
      ];
  }},
  { q: 32, fundo: 'rosa', els: (f) => [
      E(`<h1 class="tit" style="font-size:150px">meus<br><span style="color:#F594A7">projetos</span></h1>`, 140, 90, 800, 0, 0),
      ...(f >= 4 ? [E(`<div class="pol" style="height:620px"><img src="arte/print-blast.png"><span>Blast</span></div>`, 80, 460 - (f < 6 ? 160 : 0), 480, -6, 4)] : []),
      ...(f >= 10 ? [E(`<div class="pol" style="height:620px"><img src="arte/print-underground-cel.png"><span>Underground</span></div>`, 540, 520 - (f < 12 ? 160 : 0), 460, 5, 10)] : []),
      ...(f >= 16 ? [E(`<div class="pol" style="height:640px"><img src="../public/exemplos/social/img/13.jpg"><span>Instagram</span></div>`, 280, 1060 - (f < 18 ? 160 : 0), 500, -2, 16)] : []),
      ...(f >= 20 ? [E(`<img src="kit/alfinete-rosa.png" style="width:100%">`, 260, 420, 110, -15, 20)] : []),
      ...(f >= 22 ? [E(`<img src="kit/alfinete-menta.png" style="width:100%">`, 720, 480, 85, 12, 22)] : []),
  ]},
  { q: 42, fundo: 'menta', els: (f) => {
      const poses = ['look2', 'look3', 'look1', 'pirulito', 'ursinho', 'corpo'];
      const tags = [['sites', '#F594A7', '#fff'], ['apps', '#5E9C83', '#fff'], ['design', '#FAF6E6', '#4E2A1A'], ['social', '#4E2A1A', '#FAF6E6'], ['marcas', '#F594A7', '#fff'], ['tudo ♡', '#FAF6E6', '#4E2A1A']];
      const larg = { look1: 560, look2: 590, look3: 620, pirulito: 900, ursinho: 720, corpo: 700 };
      const i = Math.min(poses.length - 1, Math.floor(f / 7)), k = f - i * 7;
      const els = [E(`<h1 class="tit" style="font-size:120px">eu crio...</h1>`, 140, 110, 800, 0, 0)];
      if (k < 2 && i > 0) els.push(puff(360, 700, 1), puff(300, 950, .8), puff(560, 900, .7));
      else els.push(E(`<img src="${P(poses[i])}" style="width:100%">`, 540 - larg[poses[i]] / 2, 420, larg[poses[i]], 0, i * 7 + 2));
      els.push(E(`<span class="tag" style="background:${tags[i][1]};color:${tags[i][2]};font-size:84px">${tags[i][0]}</span>`, 300, 1700, 480, i % 2 ? 4 : -4, i * 7));
      return els;
  }},
  { q: 34, fundo: '', els: (f) => [
      E(`<h1 class="tit" style="font-size:130px">orçamento<br><span style="color:#AFD4C0">na hora</span></h1>`, 120, 100, 840, 0, 0),
      E(`<div class="cel"><img src="arte/print-orcamento-template.png"></div>`, Math.max(140, 1080 - f * 120), 520, 470, 5),
      ...(f >= 10 ? [E(`<img src="${P('apontando')}" style="width:100%;transform:scaleX(-1)">`, 560, 560, 560, 0, 10)] : []),
      ...(f >= 16 ? [E(`<div class="selo"><div><small>a partir de</small>R$190</div></div>`, 120, 1360, 360, -10, 16)] : []),
      ...(f >= 16 && f < 24 ? [E(`<div style="position:relative;width:700px;height:700px">${granulado(26, 0, 0, 700, 700, 99 + f)}</div>`, -60 - (f - 16) * 6, 1180 - (f - 16) * 10, 700, 0)] : []),
  ]},
  { q: 40, fundo: 'choco', els: (f) => {
      const y = f < 2 ? -300 : f < 4 ? 340 : f < 5 ? 240 : 280;
      return [
        E(`<div style="position:relative;width:1080px;height:1920px">${granulado(40, 0, (f * 60) % 1920 - 1920, 1080, 1920, 7)}${granulado(40, 0, (f * 60) % 1920, 1080, 1920, 7)}</div>`, 0, 0, 1080, 0),
        E(`<img src="kit2/logo-final.png" style="width:100%">`, 90, y, 900, -3),
        ...(f >= 8 ? [E(`<p style="font-family:Fredoka;font-weight:700;font-size:84px;color:#FAF6E6;text-align:center;line-height:1.05">seu projeto digital<br>feito com <span style="color:#F594A7">carinho</span></p>`, 90, 900, 900, 0, 8)] : []),
        ...(f >= 14 ? [E(`<img src="${P('ursinho')}" style="width:100%">`, 330, 1150, 420, 0, 14)] : []),
        ...(f >= 22 ? [E(`<span class="tag" style="background:#E2687F;color:#fff;border-color:#FAF6E6;font-size:64px">link na bio ♡</span>`, 270, 1710, 540, -3, 22)] : []),
      ];
  }},
];
const TOTAL = cenas.reduce((t, c) => t + c.q, 0);
window.TOTAL = TOTAL;

// cortina de calda: desce nos últimos 4 quadros da cena, sobe nos 3 primeiros da próxima
function cortina(prog) {
  if (prog <= 0) return '';
  const h = prog * 2200;
  let d = `M0 0 H1080 V${h - 200}`;
  for (let x = 1080; x > 0; x -= 90) { const g = 80 + ((x * 37) % 140); d += ` C${x} ${h - 150} ${x - 10} ${h - 200 + g} ${x - 45} ${h - 200 + g} C${x - 80} ${h - 200 + g} ${x - 90} ${h - 150} ${x - 90} ${h - 200}`; }
  d += ' Z';
  return `<svg style="position:absolute;left:0;top:0;z-index:50" width="1080" height="1920"><path d="${d}" fill="#4E2A1A"/><path d="M0 0 H1080 V40 H0Z" fill="#88553E"/></svg>`;
}
window.quadro = (n) => {
  let f = n, c = 0;
  while (f >= cenas[c].q) { f -= cenas[c].q; c++; }
  const cena = cenas[c];
  palco.className = cena.fundo;
  seed = 1 + Math.floor(n / 2) * 7;
  let html = cena.els(f).map((e) => {
    const jx = (rnd() - .5) * 8, jy = (rnd() - .5) * 8, jr = (rnd() - .5) * 2.4;
    const d = f - e.ini, sc = d === 0 ? 'scale(1.18,.86)' : d === 1 ? 'scale(.92,1.1)' : '';
    return `<div class="e" style="left:${e.x + jx}px;top:${e.y + jy}px;width:${e.w}px;transform:rotate(${e.r + jr}deg) ${sc}">${e.html}</div>`;
  }).join('') + '<div class="papel"></div>';
  let prog = 0;
  if (c < cenas.length - 1 && f >= cena.q - 4) prog = (f - (cena.q - 4) + 1) / 4;
  if (c > 0 && f < 3) prog = 1 - (f + 1) / 4;
  html += cortina(prog);
  palco.innerHTML = html;
};
</script></body></html>
