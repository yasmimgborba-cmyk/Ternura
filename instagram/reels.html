<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,800;1,600&display=swap" rel="stylesheet">
<style>
:root { --menta:#AFD4C0; --menta-e:#5E9C83; --choco:#88553E; --choco-e:#4E2A1A; --creme:#FAF6E6; --rosa:#F594A7; --rosa-e:#E2687F; --rosa-c:#FBE3EA; }
* { box-sizing:border-box; margin:0; }
body { width:1080px; height:1920px; overflow:hidden; font-family:Nunito, sans-serif; color:var(--choco-e); }
#palco { position:relative; width:1080px; height:1920px; overflow:hidden; background:#FFF6EE; }
.e { position:absolute; transform-origin:center; }
.sombra { filter:drop-shadow(0 16px 18px rgba(78,42,26,.25)); }
.tit { font-family:Fredoka; font-weight:700; line-height:.95; color:var(--creme); -webkit-text-stroke:20px var(--choco-e); paint-order:stroke fill; text-shadow:0 10px 0 rgba(78,42,26,.45); text-align:center; }
.gancho { background:#fff; border:7px solid var(--choco-e); border-radius:40px; padding:24px 34px; font-family:Fredoka; font-weight:700; font-size:62px; line-height:1.1; text-align:center; box-shadow:0 12px 0 var(--choco-e); }
.tag { display:inline-block; font-family:Fredoka; font-weight:700; font-size:64px; padding:8px 36px; border-radius:999px; border:7px solid var(--choco-e); }
.papel { position:absolute; inset:0; pointer-events:none; opacity:.07; background-image:radial-gradient(#000 1px, transparent 1.3px); background-size:4px 4px; z-index:90; }
.post { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; border-radius:10px; display:block; }
.carimbo { width:100%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-family:Fredoka; font-weight:700; color:#fff; border:10px solid #fff; box-shadow:0 0 0 6px var(--choco-e); }
.grade { background-color:#FFF6EE; background-image:linear-gradient(rgba(175,212,192,.5) 2px, transparent 2px), linear-gradient(90deg, rgba(175,212,192,.5) 2px, transparent 2px); background-size:60px 60px; }
</style></head>
<body><div id="palco"></div>
<script>
const P = (n) => `arte/recortes/${n}.png`;
const S = (n) => `../public/exemplos/social/img/${String(n).padStart(2, '0')}.jpg`;
const palco = document.getElementById('palco');
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const E = (html, x, y, w, r = 0, ini = -9, cls = '') => ({ html, x, y, w, r, ini, cls });
const CORES = ['#FAF6E6', '#AFD4C0', '#F594A7', '#F4C95D', '#FFFFFF', '#E2687F'];
function granulado(n, w, h, sd) { let s2 = sd; const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647; let o = '';
  for (let i = 0; i < n; i++) o += `<i style="position:absolute;left:${r2() * w}px;top:${r2() * h}px;width:34px;height:11px;border-radius:6px;background:${CORES[Math.floor(r2() * 6)]};transform:rotate(${r2() * 180}deg)"></i>`; return o; }

const V = {};

// ===== 1 · TIRA PRINT: descubra a paleta da sua marca =====
const PALETAS = [
  ['Napolitano', ['#F594A7', '#FAF6E6', '#88553E', '#4E2A1A'], 'delicada e acolhedora', 'pirulito'],
  ['Menta com chocolate', ['#AFD4C0', '#5E9C83', '#88553E', '#FAF6E6'], 'fresca e moderna', 'look2'],
  ['Morango com creme', ['#E2687F', '#FBE3EA', '#FFFFFF', '#7E412A'], 'romântica e doce', 'ursinho'],
  ['Biscoitinho', ['#D9B48F', '#F4E4CF', '#88553E', '#E2687F'], 'quentinha e confiável', 'look3'],
  ['Algodão doce', ['#F7C6D9', '#C9E7F2', '#FFF6EE', '#A98BC9'], 'sonhadora e criativa', 'look1'],
  ['Brigadeiro', ['#4E2A1A', '#88553E', '#F4C95D', '#FAF6E6'], 'elegante e marcante', 'corpo'],
];
V.print = { q: 132, fundo: 'grade', els: (n) => {
  const gira = n >= 12 && n < 120;
  const i = gira ? Math.floor(n / 2) % PALETAS.length : 0;
  const [nome, cores, vibe, pose] = PALETAS[i];
  const els = [
    E(`<div class="gancho">📸 tira print e descubra<br>a <span style="color:#E2687F">paleta da sua marca</span></div>`, 90, 80, 900, -2, 0, 'sombra'),
    E(`<div style="display:flex;gap:0;border:8px solid #4E2A1A;border-radius:40px;overflow:hidden;height:420px">${cores.map((c) => `<div style="flex:1;background:${c}"></div>`).join('')}</div>`, 90, 430, 900, 0, -9, 'sombra'),
    E(`<p style="font-family:Fredoka;font-weight:700;font-size:96px;text-align:center;line-height:1">${nome}</p><p style="font-family:Caveat;font-size:70px;text-align:center;color:#E2687F">${vibe}</p>`, 40, 900, 1000, 0),
    E(`<img src="${P(pose)}" style="width:100%">`, 330, 1120, 420, 0, -9, 'sombra'),
  ];
  if (n >= 120) els.push(E(`<div class="tag" style="background:#E2687F;color:#fff;font-size:56px">qual saiu pra você? ↓</div>`, 200, 1760, 680, -3, 120, 'sombra'));
  return els;
}};

// ===== 2 · 3 ERROS QUE DEIXAM SEU POST AMADOR =====
const errado = (txt, estilo) => `<div style="background:#fff;border:6px solid #999;border-radius:24px;height:560px;padding:30px;${estilo}">${txt}</div>`;
const ERROS = [
  ['muitas fontes', errado(`<p style="font-family:Impact;font-size:80px;color:#c00">PROMO</p><p style="font-family:'Comic Sans MS';font-size:60px;color:#06c">de doces</p><p style="font-family:Georgia;font-style:italic;font-size:54px;color:#090">só hoje!!!</p><p style="font-family:Courier;font-size:44px">chama no direct</p>`, ''),
   `<img class="post" src="${S(1)}" style="height:560px">`],
  ['texto colado na borda', errado(`<p style="font-family:Arial;font-weight:900;font-size:66px;line-height:1;margin:-20px -24px;color:#4E2A1A">BOLOS ENCOMENDAS FAÇA JÁ SEU PEDIDO PELO WHATSAPP AGORA MESMO</p>`, ''),
   `<img class="post" src="${S(7)}" style="height:560px">`],
  ['cores demais', errado(`<div style="height:100%;border-radius:12px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f);display:grid;place-items:center"><p style="font-family:Arial;font-weight:900;font-size:80px;color:#0f0;-webkit-text-stroke:3px #f0f">PROMO</p></div>`, ''),
   `<img class="post" src="${S(12)}" style="height:560px">`],
];
V.erros = { q: 150, fundo: 'rosa', els: (n) => {
  const els = [E(`<h1 class="tit" style="font-size:112px">3 erros que deixam<br>seu post <span style="color:#F594A7">amador</span></h1>`, 40, 70, 1000, 0, 0, 'sombra')];
  if (n < 12) { els.push(E(`<img src="${P('apontando')}" style="width:100%">`, 280, 520, 640, 0, 2, 'sombra')); return els; }
  const k = n - 12, i = Math.min(2, Math.floor(k / 40)), f = k - i * 40;
  const [nome, ruim, bom] = ERROS[i];
  els.push(E(`<div class="tag" style="background:#fff">${i + 1}. ${nome}</div>`, 120, 380, 840, -2, i * 40 + 12, 'sombra'));
  els.push(E(ruim, 60, 560, 460, -4, i * 40 + 12, 'sombra'));
  if (f >= 8) els.push(E(`<div class="carimbo" style="background:#D64545;font-size:120px">✗</div>`, 330, 520, 190, -12, i * 40 + 20));
  if (f >= 18) els.push(E(`<div style="border:6px solid #4E2A1A;border-radius:24px;overflow:hidden;background:#fff">${bom}</div>`, 560, 600, 460, 4, i * 40 + 30, 'sombra'));
  if (f >= 24) els.push(E(`<div class="carimbo" style="background:#5E9C83;font-size:120px">✓</div>`, 850, 560, 190, 10, i * 40 + 36));
  if (f >= 18) els.push(E(`<p style="font-family:Caveat;font-size:80px;color:#5E9C83;text-align:center">assim fica profissional ♡</p>`, 140, 1260, 800, -2, i * 40 + 30));
  if (k >= 120) els.push(E(`<div class="gancho" style="font-size:54px">salva pra não esquecer 🔖<br><span style="color:#E2687F">e me chama pra arrumar o seu ♡</span></div>`, 90, 1460, 900, 2, 132, 'sombra'));
  return els;
}};

// ===== 3 · MONTANDO UM FEED (satisfying) =====
const ORD = [13, 8, 7, 1, 3, 12, 5, 10, 4];
V.feed = { q: 140, fundo: 'menta', els: (n) => {
  const els = [E(`<div class="gancho">montando um feed<br><span style="color:#E2687F">do zero</span> em 10 segundos ⏱</div>`, 90, 80, 900, -2, 0, 'sombra')];
  els.push(E(`<div style="background:#fff;border:8px solid #4E2A1A;border-radius:40px;height:1260px;box-shadow:0 14px 0 #4E2A1A"></div>`, 80, 430, 920, 0));
  els.push(E(`<div style="display:flex;align-items:center;gap:20px"><img src="../public/img/avatar.jpg" style="width:110px;height:110px;border-radius:50%;border:5px solid #AFD4C0;object-fit:cover"><div><b style="font-size:44px">@ternvra</b><br><span style="font-size:32px;color:#88553E">${Math.min(9, Math.max(0, Math.floor((n - 14) / 10) + 1))} posts</span></div></div>`, 130, 470, 800, 0));
  for (let i = 0; i < 9; i++) {
    const ini = 14 + i * 10; if (n < ini) continue;
    const col = i % 3, lin = Math.floor(i / 3), cai = n - ini < 2 ? -120 : 0;
    els.push(E(`<img class="post" src="${S(ORD[8 - i])}">`, 128 + col * 278, 620 + lin * 355 + cai, 260, 0, ini));
  }
  if (n >= 112) els.push(E(`<div class="tag" style="background:#E2687F;color:#fff;font-size:58px;white-space:nowrap">quer um feed assim? ♡</div>`, 190, 1740, 700, -3, 112, 'sombra'));
  return els;
}};

// ===== 4 · POV: COMO EU TRANSFORMARIA UMA MARCA =====
V.pov = { q: 150, fundo: '', els: (n) => {
  const els = [E(`<div class="gancho">POV: você me manda<br>sua marca pra <span style="color:#E2687F">repaginar</span></div>`, 90, 80, 900, -2, 0, 'sombra')];
  if (n < 50) {
    els.push(E(`<p style="font-family:Caveat;font-size:70px;text-align:center;color:#999">antes 😕</p>`, 240, 420, 600, 0));
    els.push(E(`<div style="background:#fff;border:6px solid #bbb;border-radius:20px;height:700px;display:grid;place-items:center"><p style="font-family:Arial;font-size:96px;color:#333">Doces da Bia</p></div>`, 140, 540, 800, 0, 0, 'sombra'));
    els.push(E(`<p style="font-family:Arial;font-size:36px;text-align:center;color:#777">(marca fictícia de exemplo)</p>`, 140, 1160, 800, 0));
    if (n >= 26) els.push(E(`<img src="${P('apontando')}" style="width:100%">`, 540, 1270, 500, 0, 26, 'sombra'));
    if (n >= 34) els.push(E(`<div class="tag" style="background:#fff;font-size:60px;white-space:nowrap">deixa comigo ✨</div>`, 100, 1450, 520, -4, 34, 'sombra'));
  } else {
    const f = n - 50;
    if (f < 6) els.push(E(`<div style="position:relative;width:1080px;height:1920px;background:#4E2A1A">${granulado(80, 1080, 1920, 3 + f)}</div>`, 0, 0, 1080));
    else {
      els.push(E(`<p style="font-family:Caveat;font-size:70px;text-align:center;color:#E2687F">depois ♡</p>`, 240, 400, 600, 0, 6));
      els.push(E(`<div style="background:#FBE3EA;border:8px solid #4E2A1A;border-radius:40px;height:520px;display:grid;place-items:center;background-image:radial-gradient(rgba(226,104,127,.25) 8px,transparent 9px);background-size:50px 50px"><div style="text-align:center"><p style="font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:120px;color:#4E2A1A;line-height:1">Doces</p><p style="font-family:Fredoka;font-weight:700;font-size:110px;color:#E2687F;-webkit-text-stroke:10px #4E2A1A;paint-order:stroke fill;line-height:.9">da Bia ♡</p></div></div>`, 120, 500, 840, -2, 6, 'sombra'));
      if (f >= 14) els.push(E(`<div style="display:flex;border:6px solid #4E2A1A;border-radius:24px;overflow:hidden;height:130px"><div style="flex:1;background:#F594A7"></div><div style="flex:1;background:#FAF6E6"></div><div style="flex:1;background:#88553E"></div><div style="flex:1;background:#AFD4C0"></div></div>`, 120, 1090, 840, 0, 14, 'sombra'));
      if (f >= 22) els.push(E(`<div style="background:#88553E;border-radius:20px;height:240px;padding:30px;color:#FAF6E6;font-family:Fredoka;font-weight:700;font-size:54px">Doces da Bia<br><span style="font-family:Nunito;font-size:30px">cartão de visita</span></div>`, 120, 1290, 420, -6, 22, 'sombra'));
      if (f >= 30) els.push(E(`<div style="background:#fff;border:6px solid #4E2A1A;border-radius:24px;height:240px;padding:24px;font-family:Fredoka;font-weight:700;font-size:48px;color:#E2687F;display:grid;place-items:center;background-image:repeating-linear-gradient(90deg,#FBE3EA 0 30px,#fff 30px 60px)">tag da<br>embalagem ♡</div>`, 560, 1300, 400, 5, 30, 'sombra'));
      if (f >= 44) els.push(E(`<div class="tag" style="background:#E2687F;color:#fff">qual marca eu faço agora? ↓</div>`, 80, 1660, 920, -2, 44, 'sombra'));
    }
  }
  return els;
}};

const nome = new URLSearchParams(location.search).get('v');
const vid = V[nome]; window.TOTAL = vid.q;
const FUNDOS = { grade: 'grade', rosa: '', menta: '', '': '' };
window.quadro = (n) => {
  palco.className = vid.fundo === 'grade' ? 'grade' : '';
  palco.style.background = vid.fundo === 'rosa' ? '#FBE3EA' : vid.fundo === 'menta' ? '#DDF2E9' : vid.fundo === 'grade' ? '' : '#FFF6EE';
  if (vid.fundo !== 'grade') palco.style.backgroundImage = 'radial-gradient(rgba(255,255,255,.7) 9px, transparent 10px)', palco.style.backgroundSize = '64px 64px';
  seed = 1 + Math.floor(n / 2) * 7;
  palco.innerHTML = vid.els(n).map((e) => {
    const jx = (rnd() - .5) * 7, jy = (rnd() - .5) * 7, jr = (rnd() - .5) * 2.2;
    const d = n - e.ini, sc = d === 0 ? 'scale(1.18,.86)' : d === 1 ? 'scale(.92,1.1)' : '';
    return `<div class="e ${e.cls}" style="left:${e.x + jx}px;top:${e.y + jy}px;width:${e.w}px;transform:rotate(${e.r + jr}deg) ${sc}">${e.html}</div>`;
  }).join('') + '<div class="papel"></div>';
};
</script></body></html>
